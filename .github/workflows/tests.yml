name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    name: Package and validation tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check package and player validation tooling
        run: python3 -m unittest discover -s Tools/Tests -v
      - name: Assemble UPM archive
        run: python3 Tools/build_package.py --output .ci/audiomw.tgz
      - name: Prepare portable package fixture
        run: python3 Tools/prepare_test_project.py --destination .ci/PackageProject --unity-version 2022.3.62f1 --archive .ci/audiomw.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: audiomw-package
          path: |
            .ci/audiomw.tgz
            .ci/audiomw.json
  test:
    needs: package
    name: ${{ matrix.unityVersion }} ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 2022.3.62f1
          - 6000.0.58f1
        testMode:
          - editmode
          - playmode
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/download-artifact@v4
        with:
          name: audiomw-package
          path: .ci

      - name: Prepare isolated package project
        run: python3 Tools/prepare_test_project.py --destination .ci/TestProject --unity-version '${{ matrix.unityVersion }}' --archive .ci/audiomw.tgz

      - uses: actions/cache@v4
        with:
          path: .ci/TestProject/Library
          key: Library-${{ matrix.unityVersion }}-${{ hashFiles('Assets/AudioMW/**', 'Assets/AudioMW Demo/**', 'Tools/**') }}
          restore-keys: |
            Library-${{ matrix.unityVersion }}-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .ci/TestProject
          unityVersion: ${{ matrix.unityVersion }}
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.unityVersion }} ${{ matrix.testMode }} results
          artifactsPath: ${{ matrix.unityVersion }}-${{ matrix.testMode }}-artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.unityVersion }}-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
